name: smartlink
description: "SmartLinkViewer application for Neotelecom operators"
publish_to: 'none'
version: 0.4.3


environment:
    sdk: ^3.8.0-265.0.dev


dependencies:
    flutter:
        sdk: flutter
    http: ^1.4.0
    shared_preferences: ^2.5.3
    url_launcher: ^6.3.2
    logger: ^2.6.1
    mask_text_input_formatter: ^2.9.0
    package_info_plus: ^9.0.0
    intl: ^0.20.3
    flutter_date_formatter: ^0.0.9
    quantify: ^0.21.0
    duration: ^4.0.3
    i18n: ^4.2.6

dev_dependencies:
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4
    flutter_native_splash: ^2.4.6
    build_runner: ^2.4.13

flutter:
    uses-material-design: true
    assets:
        - assets/
        - version.json
    fonts:
      - family: Jost
        fonts:
            - asset: fonts/Jost-Medium.ttf

platforms:
    web:


flutter_native_splash:
    color: "#030910"
    image: assets/banner.png

    web: true
    ios: false
    android: false


flutter_launcher_icons:
    image_path: "assets/favicon.png"

    web:
        generate: true
        image_path: "assets/favicon.png"
        background_color: "#030910"
        theme_color: "#030910"

    windows:
        generate: false

    macos:
        generate: false

    android: false
    ios: false
